services:

  bot:
    build:
      context: .
      dockerfile: src/LinkTracker.Bot/Dockerfile
    container_name: bot.api
    ports:
      - "7175:80"
      - "7176:7176"
    environment:
      - Bot__Token=${BOT_TOKEN}
      - Scrapper__BaseUrl=http://scrapper:80
      - Database__ConnectionString=Host=linktracker.db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Database__AccessType=${POSTGRES_ACCESS_TYPE_Bot}
      - KESTREL__PORT=80
      - ClientType__Type=${PROTOCOL_TYPE_Scrapper}
      - KESTREL__TYPE=${PROTOCOL_TYPE_Bot}
      - Kestrel__MetricsPort=7176
      - Kafka__BootstrapServers=kafka-1:29092,kafka-2:29093,kafka-3:29094
      - Kafka__Topic=link-updates-processed
      - Kafka__GroupId=link-tracker-bot
      - Kafka__DeadLetterTopic=link-updates-dlq
      - Kafka__MaxProcessingAttempts=3
      - Kafka__RetryDelayMilliseconds=1000
      - Kafka__SchemaRegistryUrl=http://schema-registry:8081
    depends_on:
      bot.migrator:
        condition: service_completed_successfully
      kafka-init-topics:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
    networks:
      - linktracker-network

  scrapper:
    build:
      context: .
      dockerfile: src/LinkTracker.Scrapper/Dockerfile
    container_name: scrapper.api
    ports:
      - "7197:80"
      - "7198:7198"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TelegramBot__BaseUrl=http://bot:80
      - Database__ConnectionString=Host=linktracker.db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Database__AccessType=${POSTGRES_ACCESS_TYPE_Scrapper}
      - KESTREL__PORT=80
      - ClientType__Type=${PROTOCOL_TYPE_Bot}
      - KESTREL__TYPE=${PROTOCOL_TYPE_Scrapper}
      - Kestrel__MetricsPort=7198
      - Notification__Transport=Kafka
      - Kafka__BootstrapServers=kafka-1:29092,kafka-2:29093,kafka-3:29094
      - Kafka__Topic=link-updates
      - Kafka__SchemaRegistryUrl=http://schema-registry:8081
      - Valkey__Configuration=192.168.65.254:6380,192.168.65.254:6381,192.168.65.254:6382,connectRetry=20,connectTimeout=60000,syncTimeout=60000,keepAlive=10,allowAdmin=true,ssl=false
    depends_on:
      scrapper.migrator:
        condition: service_completed_successfully
      kafka-init-topics:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
      valkey-cluster-ready:
        condition: service_completed_successfully
    networks:
      - linktracker-network

  ai-agent:
    build:
      context: .
      dockerfile: src/LinkTracker.AiAgent/Dockerfile
    container_name: ai-agent.api
    ports:
      - "7088:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - Kafka__BootstrapServers=kafka-1:29092,kafka-2:29093,kafka-3:29094
      - Kafka__ConsumerTopic=link-updates
      - Kafka__ProduceTopic=link-updates-processed
      - Kafka__SchemaRegistryUrl=http://schema-registry:8081
      - AiAgent__Summarization__ApiKey=${AiAgent__Summarization__ApiKey}
    depends_on:
      kafka-init-topics:
        condition: service_completed_successfully
      schema-registry:
        condition: service_started
    networks:
      - linktracker-network

  bot.migrator:
    build:
      context: .
      dockerfile: src/LinkTracker.Bot.Migrator/Dockerfile
    container_name: bot.migrator
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__ConnectionString=Host=linktracker.db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      linktracker.db:
        condition: service_healthy
    networks:
      - linktracker-network
    restart: "no"

  scrapper.migrator:
    build:
      context: .
      dockerfile: src/LinkTracker.Scrapper.Migrator/Dockerfile
    container_name: scrapper.migrator
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__ConnectionString=Host=linktracker.db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      linktracker.db:
        condition: service_healthy
      bot.migrator:
        condition: service_completed_successfully
    networks:
      - linktracker-network
    restart: "no"

  linktracker.db:
    image: postgres:16
    container_name: linktracker.db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - linktracker-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: linktracker.zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q 'Mode:'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - linktracker-network

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: linktracker.kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
    restart: on-failure
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - linktracker-network

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: linktracker.kafka-2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://kafka-2:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29093,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
    restart: on-failure
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - linktracker-network

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: linktracker.kafka-3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://kafka-3:29094,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29094,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
    restart: on-failure
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - linktracker-network

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.1
    container_name: linktracker.kafka-init-topics
    depends_on:
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    command: >
      bash -c "
      cub kafka-ready -b kafka-1:29092 1 60 &&
      kafka-topics --bootstrap-server kafka-1:29092
      --create --if-not-exists
      --topic link-updates
      --partitions 3
      --replication-factor 3
      --config min.insync.replicas=2
      &&
      kafka-topics --bootstrap-server kafka-1:29092
      --create --if-not-exists
      --topic link-updates-dlq
      --partitions 3
      --replication-factor 3
      --config min.insync.replicas=2
      &&
      kafka-topics --bootstrap-server kafka-1:29092
      --create --if-not-exists
      --topic link-updates-processed
      --partitions 3
      --replication-factor 3
      --config min.insync.replicas=2
      "
    networks:
      - linktracker-network
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: linktracker.kafka-ui
    depends_on:
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - linktracker-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: linktracker.schema-registry
    depends_on:
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:29092,PLAINTEXT://kafka-2:29093,PLAINTEXT://kafka-3:29094
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: on-failure
    networks:
      - linktracker-network

  valkey-node-1:
    image: valkey/valkey:8.0
    container_name: valkey-node-1
    command: >
      valkey-server
      --port 6379
      --bind 0.0.0.0
      --protected-mode no
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 192.168.65.254
      --cluster-announce-port 6380
      --cluster-announce-bus-port 16380
    ports:
      - "6380:6379"
      - "16380:16379"
    volumes:
      - valkey_node_1_data:/data
    networks:
      - linktracker-network
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -h localhost ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey-node-2:
    image: valkey/valkey:8.0
    container_name: valkey-node-2
    command: >
      valkey-server
      --port 6379
      --bind 0.0.0.0
      --protected-mode no
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 192.168.65.254
      --cluster-announce-port 6381
      --cluster-announce-bus-port 16381
    ports:
      - "6381:6379"
      - "16381:16379"
    volumes:
      - valkey_node_2_data:/data
    networks:
      - linktracker-network
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -h localhost ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey-node-3:
    image: valkey/valkey:8.0
    container_name: valkey-node-3
    command: >
      valkey-server
      --port 6379
      --bind 0.0.0.0
      --protected-mode no
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-ip 192.168.65.254
      --cluster-announce-port 6382
      --cluster-announce-bus-port 16382
    ports:
      - "6382:6379"
      - "16382:16379"
    volumes:
      - valkey_node_3_data:/data
    networks:
      - linktracker-network
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -h localhost ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey-init:
    image: valkey/valkey:8.0
    container_name: valkey-init
    depends_on:
      valkey-node-1:
        condition: service_healthy
      valkey-node-2:
        condition: service_healthy
      valkey-node-3:
        condition: service_healthy
    networks:
      - linktracker-network
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creating Valkey cluster..."

        valkey-cli -h host.docker.internal -p 6380 cluster info | grep -q "cluster_state:ok" || \
        valkey-cli --cluster create \
          host.docker.internal:6380 \
          host.docker.internal:6381 \
          host.docker.internal:6382 \
          --cluster-replicas 0 \
          --cluster-yes

        echo "Valkey cluster created"

  valkey-cluster-ready:
    image: valkey/valkey:8.0
    container_name: valkey-cluster-ready
    depends_on:
      valkey-init:
        condition: service_completed_successfully
    networks:
      - linktracker-network
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting Valkey cluster OK..."

        until valkey-cli -h host.docker.internal -p 6380 cluster info | grep -q "cluster_state:ok"
        do
          echo "Valkey cluster is not ready..."
          sleep 3
        done

        echo "VALKEY CLUSTER READY"

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    networks:
      - linktracker-network

  prometheus:
    image: prom/prometheus
    container_name: linktracker.prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - bot
      - scrapper
      - ai-agent
    networks:
      - linktracker-network

  grafana:
    image: grafana/grafana-oss
    container_name: linktracker.grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - linktracker-network


networks:
  linktracker-network:
    driver: bridge

volumes:
  postgres_data:
  valkey_node_1_data:
  valkey_node_2_data:
  valkey_node_3_data:
  redis_insight_data:
  grafana_data: